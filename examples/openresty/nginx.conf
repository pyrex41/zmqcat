# Sidecar on the same host: `zmqcat serve` or `zmqcat join $TOKEN`
# Then: curl -X POST --data-binary 'hello' localhost:8080/mbox/jobs
#       curl localhost:8080/mbox/jobs

worker_processes 1;
error_log stderr notice;
pid logs/nginx.pid;
daemon off;

events { worker_connections 64; }

http {
    lua_package_path "$prefix/?.lua;;";

    server {
        listen 8080;

        location /mbox/ {
            content_by_lua_block {
                local zmqcat = require "zmqcat"
                local name = ngx.var.uri:match("/mbox/(.+)$") or "inbox"
                local c, err = zmqcat.connect(os.getenv("ZMQCAT_LISTEN"))
                if not c then
                    ngx.status = 502
                    ngx.say(err)
                    return
                }
                if ngx.req.get_method() == "POST" then
                    ngx.req.read_body()
                    local body = ngx.req.get_body_data() or ""
                    local f, perr = c:put(name, body)
                    c:close()
                    if not f then
                        ngx.status = 500
                        ngx.say(perr)
                        return
                    end
                    ngx.say("ok")
                    return
                end
                local f, terr = c:take(name)
                c:close()
                if not f then
                    ngx.status = 504
                    ngx.say(terr)
                    return
                end
                ngx.header["X-Zmqcat-From"] = f.from or ""
                ngx.print(f.text or "")
            }
        }
    }
}
